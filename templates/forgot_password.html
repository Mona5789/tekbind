<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <title>Forgot Password</title>

    <link href="/static/assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <form class="shadow p-4">

                {% csrf_token %}

                <h3 class="text-center mb-4">
                    Forgot Password
                </h3>

                <!-- EMAIL -->

                <div id="emailSection">

                    <input
                        type="email"
                        id="email"
                        class="form-control mb-3"
                        placeholder="Registered Email"
                    >

                    <button
                        type="button"
                        id="sendOtpBtn"
                        class="btn btn-primary w-100">

                        Send OTP

                    </button>

                </div>

                <!-- OTP -->

                <div
                    id="otpSection"
                    style="display:none;">

                    <input
                        type="text"
                        id="otp"
                        maxlength="6"
                        class="form-control mt-3"
                        placeholder="Enter OTP">

                    <div class="d-flex justify-content-between mt-2">

                        <small id="timer">
                            01:00
                        </small>

                        <button
                            type="button"
                            id="resendBtn"
                            class="btn btn-link p-0"
                            disabled>

                            Resend OTP

                        </button>

                    </div>

                    <button
                        type="button"
                        id="verifyBtn"
                        class="btn btn-success w-100 mt-3">

                        Verify OTP

                    </button>

                </div>

                <!-- PASSWORD -->

                <div
                    id="passwordSection"
                    style="display:none;">

                    <input
                        type="password"
                        id="password"
                        class="form-control mt-3"
                        placeholder="New Password">

                    <input
                        type="password"
                        id="confirm_password"
                        class="form-control mt-3"
                        placeholder="Confirm Password">

                    <button
                        type="button"
                        id="resetBtn"
                        class="btn btn-danger w-100 mt-3">

                        Reset Password

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>

function getCookie(name){

    let cookieValue=null;

    if(document.cookie){

        const cookies=document.cookie.split(";");

        for(let cookie of cookies){

            cookie=cookie.trim();

            if(cookie.startsWith(name+"=")){

                cookieValue=decodeURIComponent(cookie.substring(name.length+1));

            }

        }

    }

    return cookieValue;

}

const csrf=getCookie("csrftoken");

let timer;
let seconds=60;

function startTimer(){

    seconds=60;

    document.getElementById("resendBtn").disabled=true;

    timer=setInterval(function(){

        let m=Math.floor(seconds/60);

        let s=seconds%60;

        document.getElementById("timer").innerHTML=
        `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;

        seconds--;

        if(seconds<0){

            clearInterval(timer);

            document.getElementById("resendBtn").disabled=false;

        }

    },1000);

}


// SEND OTP

document.getElementById("sendOtpBtn").onclick = function () {

    let email = document.getElementById("email").value.trim();

    if (!email) {
        Swal.fire("Error", "Please enter your registered email.", "error");
        return;
    }

    Swal.fire({
        title: "Sending OTP...",
        text: "Please wait",
        allowOutsideClick: false,
        allowEscapeKey: false,
        didOpen: () => {
            Swal.showLoading();
        }
    });
    fetch("/api/forgot-password/", {
        method: "POST",
        headers: {
            "Content-Type": "application/x-www-form-urlencoded",
            "X-CSRFToken": csrf
        },
        body: `email=${encodeURIComponent(email)}`
    })
    .then(r => r.json())
    .then(data => {
        Swal.close();
        if (data.status === "success") {
            Swal.fire({
                icon: "success",
                title: "OTP Sent",
                text: data.message
            });
            document.getElementById("otpSection").style.display = "block";
            startTimer();
        } else {
            Swal.fire("Error", data.error, "error");
        }
    })
    .catch(() => {
        Swal.close();
        Swal.fire(
            "Error",
            "Unable to send OTP. Please try again.",
            "error"
        );
    });
};
// VERIFY OTP
document.getElementById("verifyBtn").onclick=function(){
    let otp=document.getElementById("otp").value;
    Swal.fire({
        title: "Verifying OTP...",
        text: "Please wait",
        allowOutsideClick: false,
        didOpen: () => Swal.showLoading()
    });
    fetch("/api/verify-forgot-password/",{
        method:"POST",
        headers:{
            "Content-Type":"application/x-www-form-urlencoded",
            "X-CSRFToken":csrf
        },
        body:`otp=${otp}`
    })
    .then(r=>r.json())
    .then(data=>{
        if(data.status=="success"){
            Swal.fire("Verified","","success");
            document.getElementById("passwordSection").style.display="block";
        }
        else{
            Swal.fire("Error",data.error,"error");
        }
    });
};
// RESET PASSWORD
document.getElementById("resetBtn").onclick=function(){
    let password=document.getElementById("password").value;
    let confirm=document.getElementById("confirm_password").value;
    Swal.fire({
        title: "Resetting Password...",
        text: "Please wait",
        allowOutsideClick: false,
        didOpen: () => Swal.showLoading()
    });
    fetch("/api/reset-password/",{
        method:"POST",
        headers:{
            "Content-Type":"application/x-www-form-urlencoded",
            "X-CSRFToken":csrf
        },
        body:
        `password=${encodeURIComponent(password)}&confirm_password=${encodeURIComponent(confirm)}`
    })
    .then(r=>r.json())
    .then(data=>{
        if(data.status=="success"){
            Swal.fire({
                icon:"success",
                title:data.message
            }).then(()=>{
                window.location.href="/login/";
            });
        }
        else{
            Swal.fire("Error",data.error,"error");
        }
    });
};
// RESEND OTP
document.getElementById("resendBtn").onclick=function(){
    Swal.fire({
        title: "Resending OTP...",
        text: "Please wait",
        allowOutsideClick: false,
        didOpen: () => Swal.showLoading()
    });
    fetch("/api/resend-forgot-password/",{
        method:"POST",
        headers:{
            "X-CSRFToken":csrf
        }
    })
    .then(r=>r.json())
    .then(data=>{
        if(data.status=="resent"){
            Swal.fire("Success","OTP Resent","success");
            clearInterval(timer);
            startTimer();
        }
        else{
            Swal.fire("Error",data.error,"error");
        }
    });
};
</script>
</body>
</html>
